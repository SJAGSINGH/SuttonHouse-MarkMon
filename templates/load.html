<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sutton House — System Initialising</title>

  <style>
    /* =========================================================
       GLOBAL
    ========================================================= */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040607;
      color: #e8efef;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================================================
       LOAD / CONDITIONING SCREEN
    ========================================================= */
    .load-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% 22%, rgba(0,255,170,0.08), transparent 28%),
        radial-gradient(circle at 20% 18%, rgba(201,168,90,0.06), transparent 24%),
        linear-gradient(180deg, #050708 0%, #040607 100%);
      opacity: 1;
      pointer-events: auto;
      transition: opacity 1100ms ease;
    }

    .load-screen.is-exiting {
      opacity: 0;
      pointer-events: none;
    }

    .load-bg-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 68%, rgba(0,255,170,0.05), transparent 22%),
        radial-gradient(circle at 50% 48%, rgba(255,255,255,0.02), transparent 30%);
      pointer-events: none;
    }

 .load-rose-wrap {
  position: absolute;
  left: 50%;
  top: 13vh;                 /* sits behind title */
  transform: translate(-50%, -50%);
  width: min(28vw, 320px);
  height: min(28vw, 320px);
  display: grid;
  place-items: center;
  pointer-events: none;
  z-index: 1;                /* behind text */
}

.load-rose {
  width: 100%;
  height: auto;
  opacity: 0.08;             /* slightly visible but restrained */
  filter:
    saturate(0.9)
    brightness(0.84)
    blur(0.6px)
    drop-shadow(0 0 26px rgba(201,168,90,0.08));

  animation: roseBreathe 9s ease-in-out infinite;
}
    

@keyframes roseBreathe {
  0%, 100% { transform: scale(1); opacity: 0.10; }
  50%      { transform: scale(1.03); opacity: 0.13; }
}
   
    /* header */
    .load-header {
      position: absolute;
      top: 11vh;                 /* aligned with rose */
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 3;                /* above rose */
    }

    .load-brand {
      color: #d3b261;
      font-size: clamp(26px, 3.1vw, 42px);
      letter-spacing: 0.18em;    /* slightly more premium spacing */
      font-weight: 700;
      line-height: 1;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .load-sub {
      color: rgba(230, 238, 240, 0.9);
      font-size: clamp(11px, 1vw, 14px);
      letter-spacing: 0.34em;
      font-weight: 500;
      text-transform: uppercase;
    }

    /* centered SCADA */
    /* centered SCADA */
.load-scada-wrap {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(24vw, 250px);
  z-index: 2;
  display: grid;
  place-items: center;
  pointer-events: none;
}

.load-scada-energy {

  height: min(42vw, 420px);
  border-radius: 50%;

  z-index: 1;

.load-scada-svg-shell,
.load-scada-svg-wrap,

  position: relative;
  z-index: 2;
}

.load-scada-svg-wrap {
  width: 100%;
  opacity: 0.94;
  filter:
    brightness(0.9)
    contrast(1.05)
    saturate(0.9)
    drop-shadow(0 0 18px rgba(120,255,220,0.06))
    drop-shadow(0 0 42px rgba(120,255,220,0.03));
  transform-origin: 50% 86%;
}

#load-scada-svg {
  width: 100%;
  height: auto;
  display: block;
}

/* PNG fallback kept disabled, not deleted */
.load-scada-man {
  width: 100%;
  height: auto;
  opacity: 0.94;
  filter:
    brightness(0.9)
    contrast(1.05)
    saturate(0.9)
    drop-shadow(0 0 18px rgba(120,255,220,0.06))
    drop-shadow(0 0 42px rgba(120,255,220,0.03));
  transform-origin: 50% 86%;
}

@keyframes scadaEnergyPulse {
  0%, 100% {
    transform: translate(-50%, -50%) scale(0.98);
    opacity: 0.58;
  }
  50% {
    transform: translate(-50%, -50%) scale(1.06);
    opacity: 0.92;
  }
}

#load-scada-up-emission {
  animation: loadUpEmission 4.8s ease-in-out infinite;
  transform-origin: center;
}

@keyframes loadUpEmission {
  0%, 100% {
    opacity: 0.38;
    transform: scaleY(0.92);
  }
  50% {

    transform: scaleY(1.08);

    /* doctrine line */

<script>
  const lines = [
    "Silence is a valid state.",
    "Signals are observed, not followed.",
    "Observation precedes action.",
    "The system governs participation.",
    "Discipline is required before deployment.",
    "The system is working — now your job is not to interfere with it.",
    "EXPECT TO BE GOVERNED"
  ];

  const statuses = [
    "LINKING MACRO STATE",
    "VERIFYING REGIME CONDITIONS",
    "SYNCING NODE STRUCTURE",
    "INITIALISING SENTINEL"
  ];

  let lineIndex = 0;
  let statusIndex = 0;
  let exiting = false;
  let statusTimer = null;
  let lineTimer = null;

  function cycleStatus() {
    if (exiting) return;
    const statusEl = document.getElementById("status");
    if (!statusEl) return;
    statusEl.textContent = statuses[statusIndex];
    statusIndex = (statusIndex + 1) % statuses.length;
  }

  function nextLine() {
    if (exiting) return;

    const el = document.getElementById("text");
    if (!el) return;

    el.classList.remove("show", "final");

    lineTimer = setTimeout(() => {
      if (exiting) return;

      el.textContent = lines[lineIndex];

      if (lineIndex === lines.length - 1) {
        el.classList.add("final");
      }

      el.classList.add("show");
      lineIndex += 1;

      if (lineIndex < lines.length) {
        lineTimer = setTimeout(nextLine, 4000);
      } else {
        lineTimer = setTimeout(exitLoad, 2500);
      }
    }, 400);
  }

  async function exitLoad() {
    if (exiting) return;
    exiting = true;

    if (statusTimer) clearInterval(statusTimer);
    if (lineTimer) clearTimeout(lineTimer);

    const screen = document.getElementById("load-screen");
    if (screen) screen.classList.add("is-exiting");

    try {
      const res = await fetch("/mark_conditioned", {
        method: "POST",
        credentials: "same-origin",
        cache: "no-store"
      });

      if (!res.ok) {
        throw new Error("mark_conditioned failed");
      }
    } catch (err) {
      console.error("Failed to mark conditioned:", err);
    }

    setTimeout(() => {
      window.location.replace("/");
    }, 1200);
  }

  cycleStatus();
  statusTimer = setInterval(cycleStatus, 3000);
  nextLine();
</script>
