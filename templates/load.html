<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sutton House — System Initialising</title>

  <style>
    /* =========================================================
       GLOBAL
    ========================================================= */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040607;
      color: #e8efef;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================================================
       LOAD / CONDITIONING SCREEN
    ========================================================= */
    .load-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% 22%, rgba(0,255,170,0.08), transparent 28%),
        radial-gradient(circle at 20% 18%, rgba(201,168,90,0.06), transparent 24%),
        linear-gradient(180deg, #050708 0%, #040607 100%);
      opacity: 1;
      pointer-events: auto;
      transition: opacity 1100ms ease;
    }

    .load-screen.is-exiting {
      opacity: 0;
      pointer-events: none;
    }

    .load-bg-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 68%, rgba(0,255,170,0.05), transparent 22%),
        radial-gradient(circle at 50% 48%, rgba(255,255,255,0.02), transparent 30%);
      pointer-events: none;
    }

    /* faint rose behind SCADA */
    .load-rose-wrap {
      position: absolute;
      left: 50%;
      top: 49%;
      transform: translate(-50%, -50%);
      width: min(34vw, 340px);
      height: min(34vw, 340px);
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 1;
    }

    .load-rose {
      width: 100%;
      height: auto;
      opacity: 0.065;
      filter:
        saturate(0.9)
        brightness(0.82)
        blur(0.2px)
        drop-shadow(0 0 22px rgba(201,168,90,0.07));
      animation: roseBreathe 8s ease-in-out infinite;
    }

    @keyframes roseBreathe {
      0%, 100% { transform: scale(1); opacity: 0.06; }
      50%      { transform: scale(1.018); opacity: 0.075; }
    }

    /* header */
    .load-header {
      position: absolute;
      top: 8.5vh;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 3;
      pointer-events: none;
    }

    .load-brand {
      color: #d3b261;
      font-size: clamp(26px, 3.1vw, 42px);
      letter-spacing: 0.16em;
      font-weight: 700;
      line-height: 1;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .load-sub {
      color: rgba(230, 238, 240, 0.9);
      font-size: clamp(11px, 1vw, 14px);
      letter-spacing: 0.34em;
      font-weight: 500;
      text-transform: uppercase;
    }

    /* centered SCADA */
    .load-scada-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(24vw, 250px);
      z-index: 2;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .load-scada-man {
      width: 100%;
      height: auto;
      opacity: 0.94;
      filter:
        brightness(0.9)
        contrast(1.05)
        saturate(0.9)
        drop-shadow(0 0 18px rgba(120,255,220,0.06))
        drop-shadow(0 0 42px rgba(120,255,220,0.03));
      transform-origin: 50% 86%;
      animation: scadaIdleSway 6.5s ease-in-out infinite;
    }

    @keyframes scadaIdleSway {
      0%, 100% { transform: rotate(-0.55deg) translateY(0); }
      50%      { transform: rotate(0.55deg) translateY(-1px); }
    }

    /* doctrine line */
    .load-conditioning {
      position: absolute;
      left: 50%;
      top: 68%;
      transform: translateX(-50%);
      width: min(78vw, 980px);
      z-index: 3;
      text-align: center;
      pointer-events: none;
    }

    .conditioning-line {
      color: rgba(220, 235, 232, 0.94);
      font-size: clamp(15px, 1.15vw, 19px);
      font-weight: 500;
      letter-spacing: 0.08em;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(6px);
      transition:
        opacity 800ms ease,
        transform 800ms ease;
      text-transform: none;
    }

    .conditioning-line.show {
      opacity: 1;
      transform: translateY(0);
    }

    .conditioning-line.final {
      color: #d8e8e3;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* bottom status */
    .load-status-wrap {
      position: absolute;
      left: 50%;
      bottom: 7.5vh;
      transform: translateX(-50%);
      width: min(70vw, 760px);
      z-index: 3;
      text-align: center;
      pointer-events: none;
    }

    .load-status-line {
      display: inline-block;
      color: rgba(0,255,170,0.82);
      font-size: clamp(10px, 0.84vw, 12px);
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(0,255,170,0.18);
      min-width: 320px;
      max-width: 560px;
      width: 100%;
    }
  </style>
</head>

<body>
  <div class="load-screen" id="load-screen">
    <div class="load-bg-glow"></div>

    <div class="load-rose-wrap" aria-hidden="true">
      <img src="/static/logo.png" alt="" class="load-rose" />
    </div>

    <div class="load-header">
      <div class="load-brand">SUTTON HOUSE</div>
      <div class="load-sub">SYSTEM INITIALISING</div>
    </div>

    <div class="load-scada-wrap">
      <img src="/static/SCADA_Man.png" alt="SCADA Man" class="load-scada-man" />
    </div>

    <div class="load-conditioning">
      <div id="text" class="conditioning-line"></div>
    </div>

    <div class="load-status-wrap">
      <div id="status" class="load-status-line"></div>
    </div>
  </div>

<script>
  const lines = [
    "Silence is a valid state.",
    "Signals are observed, not followed.",
    "Observation precedes action.",
    "The system governs participation.",
    "Discipline is required before deployment.",
    "The system is working — now your job is not to interfere with it.",
    "EXPECT TO BE GOVERNED"
  ];

  const statuses = [
    "LINKING MACRO STATE",
    "VERIFYING REGIME CONDITIONS",
    "SYNCING NODE STRUCTURE",
    "INITIALISING SENTINEL"
  ];

  let lineIndex = 0;
  let statusIndex = 0;
  let exiting = false;
  let statusTimer = null;
  let lineTimer = null;

  function cycleStatus() {
    if (exiting) return;
    const statusEl = document.getElementById("status");
    if (!statusEl) return;
    statusEl.textContent = statuses[statusIndex];
    statusIndex = (statusIndex + 1) % statuses.length;
  }

  function nextLine() {
    if (exiting) return;

    const el = document.getElementById("text");
    if (!el) return;

    el.classList.remove("show", "final");

    lineTimer = setTimeout(() => {
      if (exiting) return;

      el.textContent = lines[lineIndex];

      if (lineIndex === lines.length - 1) {
        el.classList.add("final");
      }

      el.classList.add("show");
      lineIndex += 1;

      if (lineIndex < lines.length) {
        lineTimer = setTimeout(nextLine, 4000);
      } else {
        lineTimer = setTimeout(exitLoad, 2500);
      }
    }, 400);
  }

  async function exitLoad() {
    if (exiting) return;
    exiting = true;

    if (statusTimer) clearInterval(statusTimer);
    if (lineTimer) clearTimeout(lineTimer);

    const screen = document.getElementById("load-screen");
    if (screen) screen.classList.add("is-exiting");

    try {
      const res = await fetch("/mark_conditioned", {
        method: "POST",
        credentials: "same-origin",
        cache: "no-store"
      });

      if (!res.ok) {
        throw new Error("mark_conditioned failed");
      }
    } catch (err) {
      console.error("Failed to mark conditioned:", err);
    }

    setTimeout(() => {
      window.location.replace("/");
    }, 1200);
  }

  cycleStatus();
  statusTimer = setInterval(cycleStatus, 3000);
  nextLine();
</script>
</body>
</html>
